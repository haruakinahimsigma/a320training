<style>

@media(max-width:520px){.brand{font-size:10px}.ui-btn{padding:7px 8px;font-size:10px}.topbar{padding:7px}.pill{font-size:9px;padding:5px 7px}.dock button{font-size:10px;padding:8px 2px;min-height:40px}.bottom{margin-bottom:4px}#viewLabel{top:70px}#drawer{top:70px;bottom:106px}}

const interactables=[];const state={bat1:false,bat2:false,extPwr:false,apuMaster:false,apuStart:false,apuAvail:false,apuBleed:false,fuel1:false,fuel2:false,ign:false,eng1:false,eng2:false,park:true,nav:false,beacon:false,seatbelt:false,noSmoking:false,ir1:false,ir2:false,ir3:false,lights:false,view:'capt',panel:'main'};
const root=new THREE.Group();scene.add(root);
// Flight deck shell and windshield frame
cube(root,0,1.6,-1.9,8,.35,3.4,shell);cube(root,0,3.65,-2.1,8,.35,3.2,shell);cube(root,-3.85,2.65,-2.1,.3,2,3.2,shell);cube(root,3.85,2.65,-2.1,.3,2,3.2,shell);
for(let i=-2;i<=2;i++){const x=i*1.28;cube(root,x,3.0,-2.2,.075,1.25,.12,edge)}
cube(root,0,2.42,-2.25,7.4,.11,.18,edge);
const win=cube(root,0,2.9,-2.27,7.35,1.2,.025,glass,0);win.material.side=THREE.DoubleSide;
// outside apron and horizon
const ground=cube(root,0,-.8,-17,100,.15,35,mat('#626e68'));const horizon=cube(root,0,1.15,-19,100,3,.2,mat('#718b98'));cube(root,0,2.6,-25,100,3,.2,mat('#a6b8bb'));
for(let i=-5;i<=5;i++){cube(root,i*1.4,-.7,-10,.035,.02,8,mat('#c6c8b8'))}
// Main glare shield and instrument panel
cube(root,0,1.72,.15,7.6,.42,1.0,shell);cube(root,0,1.38,.15,7.35,.28,.82,edge);
function makeScreen(x,y,z,w,h,label,kind){cube(root,x,y,z,w+.13,h+.13,.15,edge);cube(root,x,y,z-.09,w,h,.025,screen,0);const txt=textSprite(label,kind==='pfd'?'#80e7ca':'#b3d4df',28);txt.position.set(x,y,z-.11);txt.scale.set(w*.9,h*.24,1);root.add(txt);const g=new THREE.Group();g.position.set(x,y,z-.13);root.add(g);if(kind==='pfd'){const horizonLine=cube(g,0,0,0,w*.86,.018,.012,blue,0);horizonLine.position.y=-h*.03;const arc=cube(g,0,-h*.16,0,w*.52,.018,.012,amber,0);arc.rotation.z=.12;for(let i=-2;i<=2;i++)cube(g,i*w*.12,-h*.34,0,.012,.09,.012,green,0)}else if(kind==='nd'){for(let i=0;i<3;i++){const ln=cube(g,0,h*(.2-i*.18),0,w*.8,.012,.012,blue,0);ln.rotation.z=i*.15-.15}sphere(g,0,0,0,.035,green)}return {g,x,y,z,w,h,label,kind}}
const displays=[makeScreen(-2.45,1.45,-.36,1.55,.96,'PFD  ·  101','pfd'),makeScreen(-.72,1.45,-.36,1.55,.96,'ND  ·  PLAN','nd'),makeScreen(.95,1.45,-.36,1.55,.96,'E/WD  ·  NORM','ecam'),makeScreen(2.65,1.45,-.36,1.55,.96,'SD  ·  DOOR','ecam')];
// Knobs and FCU
cube(root,0,2.05,-.13,3.8,.22,.5,panel);function knob(x,y,z,caption){const base=cube(root,x,y,z,.22,.18,.2,edge);const k=cube(root,x,y+.13,z,.13,.12,.13,white);const t=textSprite(caption,'#c8d7dc',18);t.position.set(x,y+.28,z-.05);t.scale.set(.65,.16,1);root.add(t);register(base,caption,()=>{k.rotation.y+=.5});register(k,caption,()=>{k.rotation.y+=.5})}
knob(-1.35,2.05,-.45,'SPD');knob(-.45,2.05,-.45,'HDG');knob(.45,2.05,-.45,'ALT');knob(1.35,2.05,-.45,'V/S');
// Pedestal
cube(root,0,.65,1.15,2.65,.28,3.2,shell);cube(root,0,.82,.65,2.5,.12,1.35,panel);cube(root,0,.8,1.8,2.5,.12,1.25,panel2);cube(root,0,.78,2.7,2.5,.14,.55,edge);
for(let i=0;i<10;i++){const x=-1.05+(i%5)*.52,z=.45+Math.floor(i/5)*.38;const b=cube(root,x,.92,z,.28,.08,.19,edge);register(b,'MCDU key',()=>{b.material=green})}
const throttleBase=cube(root,0,1.02,2.0,.75,.18,.9,edge);const throttle=cube(root,0,1.25,1.9,.24,.42,.25,amber);let thrust=0;
const thrLabel=textSprite('THRUST',' #f5c56c'.trim(),20);thrLabel.position.set(0,1.18,2.47);thrLabel.scale.set(.8,.18,1);root.add(thrLabel);
const sidestick=cube(root,-2.85,.75,1.25,.2,.6,.2,edge);cube(root,-2.85,1.1,1.25,.36,.18,.3,red);cube(root,2.85,.75,1.25,.2,.6,.2,edge);
// Overhead panel above view, shown as a clickable physical panel in scene
const overhead=new THREE.Group();overhead.position.set(0,3.85,.1);root.add(overhead);cube(overhead,0,0,0,4.8,.18,2.2,panel2);cube(overhead,0,-.11,0,4.55,.04,2.0,edge);
const overheadItems=[];
function register(mesh,label,fn){mesh.userData.action=fn;mesh.userData.label=label;interactables.push(mesh)}
function switch3d(x,z,label,keyName){cube(overhead,x,-.06,z,.58,.04,.56,panel);const knob=sphere(overhead,x,-.16,z,.105,state[keyName]?green:white);const labelSprite=textSprite(label,'#c5d1d7',15);labelSprite.position.set(x,-.1,z+.32);labelSprite.scale.set(.55,.13,1);overhead.add(labelSprite);const hit=cube(overhead,x,-.02,z,.52,.18,.5,mat('#000000',1),0);hit.material.transparent=true;hit.material.opacity=0;register(hit,label,()=>{state[keyName]=!state[keyName];knob.material=state[keyName]?green:white;refresh()});overheadItems.push({keyName,knob})}
[['BAT 1','bat1'],['BAT 2','bat2'],['EXT PWR','extPwr'],['APU MASTER','apuMaster'],['APU START','apuStart'],['APU BLEED','apuBleed'],['FUEL 1','fuel1'],['FUEL 2','fuel2'],['IGNITION','ign'],['BEACON','beacon'],['NAV','nav'],['IR 1','ir1'],['IR 2','ir2'],['IR 3','ir3'],['SEAT BELT','seatbelt'],['NO SMOKING','noSmoking']].forEach((a,i)=>switch3d(-1.75+(i%4)*1.17,-.67+Math.floor(i/4)*.62,a[0],a[1]));
// clickable main panel regions
for(const d of displays){const hit=cube(root,d.x,d.y,d.z-.2,d.w,d.h,.08,mat('#000000'),0);hit.material.transparent=true;hit.material.opacity=0;register(hit,d.label,()=>{state.panel='main';openPanel('main')})}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let drag=null,lastX=0,lastY=0,orbit={yaw:0,pitch:0},viewMode='capt';
function onPointerDown(e){drag={x:e.clientX,y:e.clientY,moved:false};lastX=e.clientX;lastY=e.clientY}
function onPointerMove(e){if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)drag.moved=true;if(drag.moved){orbit.yaw=Math.max(-.42,Math.min(.42,orbit.yaw-dx*.003));orbit.pitch=Math.max(-.18,Math.min(.2,orbit.pitch+dy*.002));}lastX=e.clientX;lastY=e.clientY}
function onPointerUp(e){if(!drag)return;const was=drag.moved;drag=null;if(was)return;const r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-((e.clientY-r.top)/r.height*2-1);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(interactables,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.action)o=o.parent;if(o?.userData.action){o.userData.action();showToast(o.userData.label)}}}
canvas.addEventListener('pointerdown',onPointerDown);canvas.addEventListener('pointermove',onPointerMove);canvas.addEventListener('pointerup',onPointerUp);canvas.addEventListener('pointercancel',()=>drag=null);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
function setView(){const target=viewMode==='capt'?new THREE.Vector3(0,1.8,-.4):viewMode==='fo'?new THREE.Vector3(1.25,1.8,-.35):new THREE.Vector3(0,3.3,.2);camera.position.lerp(target.clone().add(new THREE.Vector3(0,.35,7.7)),.08);camera.lookAt(target);document.querySelector('#viewBtn').textContent='VIEW: '+viewMode.toUpperCase();document.querySelector('#viewLabel').textContent=(viewMode==='capt'?"CAPTAIN'S FLIGHT DECK":viewMode==='fo'?"FIRST OFFICER'S FLIGHT DECK":"OVERHEAD PANEL")+" · DRAG TO LOOK"}
let toastTimer;function showToast(s){document.querySelector('#subStatus').textContent=s.toUpperCase()+' · STATE UPDATED';clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#subStatus').textContent='COCKPIT SYSTEMS · INTERACTIVE DEMO',1700)}
function isPowered(){return state.bat1||state.bat2||state.extPwr||state.apuAvail}
function refresh(){document.querySelector('#batRead').textContent=state.bat1&&state.bat2?'ON':state.bat1||state.bat2?'PART':'OFF';document.querySelector('#apuRead').textContent=state.apuAvail?'AVAIL':state.apuStart?'START':state.apuMaster?'ON':'OFF';document.querySelector('#eng1Read').textContent=state.eng1?'RUN':state.fuel1?'READY':'OFF';document.querySelector('#eng2Read').textContent=state.eng2?'RUN':state.fuel2?'READY':'OFF';document.querySelector('#brakeRead').textContent=state.park?'SET':'OFF';displays[0].label=isPowered()?'PFD  ·  STBY':'PFD  ·  DARK';displays[1].label=isPowered()?'ND  ·  ARC':'ND  ·  DARK';displays[2].label=state.eng1||state.eng2?'ENG  ·  RUN':'E/WD  ·  NORM';}
const drawer=document.querySelector('#drawer'),drawerContent=document.querySelector('#drawerContent');
function openPanel(panelName){state.panel=panelName;drawer.classList.add('open');document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('active',b.dataset.panel===panelName));const titles={overhead:'OVERHEAD PANEL',main:'MAIN INSTRUMENT PANEL',pedestal:'CENTER PEDESTAL',checklist:'ENGINE START FLOW'};document.querySelector('#drawerTitle').textContent=titles[panelName]||'AIRCRAFT SYSTEMS';renderDrawer(panelName)}
function renderDrawer(p){drawerContent.innerHTML='';if(p==='checklist'){drawerContent.innerHTML='<div class="notice">Training-only simplified flow. This is not a certified procedure or a real aircraft checklist.</div><div class="section"><h3>POWER-UP / START FLOW</h3><div id="steps" class="checklist"></div></div><button class="ui-btn primary" id="autoStep">NEXT TRAINING STEP</button><button class="ui-btn" id="resetFlow" style="margin-left:5px">RESET</button>';renderSteps();document.querySelector('#autoStep').onclick=nextStep;document.querySelector('#resetFlow').onclick=()=>{stepIndex=0;resetState();renderDrawer('checklist')};return}
const groups=p==='overhead'?[['ELECTRICAL',['bat1','BAT 1','bat2','BAT 2','extPwr','EXT PWR']],['APU',['apuMaster','APU MASTER','apuStart','APU START','apuBleed','APU BLEED']],['ENGINE',['fuel1','ENG 1 FUEL','fuel2','ENG 2 FUEL','ign','IGNITION']],['OTHER',['beacon','BEACON','nav','NAV LIGHTS','seatbelt','SEAT BELT','noSmoking','NO SMOKING']],['INERTIAL REFERENCE',['ir1','IR 1','ir2','IR 2','ir3','IR 3']]]:p==='pedestal'?[['CENTER PEDESTAL',[ 'park','PARKING BRAKE','thrustUp','THRUST INCREASE','thrustDown','THRUST DECREASE']],['RADIO / MCDU',['mcdu','MCDU INPUT','radio','RADIO PANEL']]]:[['FLIGHT DISPLAYS',['pfd','PFD TEST','nd','ND MODE','ecam','ECAM PAGE','brightness','BRIGHTNESS']],['FLIGHT CONTROLS',['park','PARKING BRAKE','lights','PANEL LIGHTS']]];
for(const [group,items] of groups){const sec=document.createElement('div');sec.className='section';sec.innerHTML='<h3>'+group+'</h3><div class="control-grid"></div>';const grid=sec.querySelector('.control-grid');for(let i=0;i<items.length;i+=2){const key=items[i],label=items[i+1];const b=document.createElement('button');b.className='toggle '+(state[key]?'on':'');b.innerHTML='<span>'+label+'</span><i></i>';b.onclick=()=>{if(key==='thrustUp'){thrust=Math.min(1,thrust+.1);throttle.position.y=1.25+thrust*.55;showToast('Thrust '+Math.round(thrust*100)+'%')}else if(key==='thrustDown'){thrust=Math.max(0,thrust-.1);throttle.position.y=1.25+thrust*.55;showToast('Thrust '+Math.round(thrust*100)+'%')}else if(key==='mcdu'||key==='radio'||key==='pfd'||key==='nd'||key==='ecam'||key==='brightness'){showToast(label+' selected')}else{state[key]=!state[key];refresh();renderDrawer(p)}};grid.appendChild(b)}drawerContent.appendChild(sec)}}
let stepIndex=0;const steps=[['BAT 1 + BAT 2','Switch both battery controls on.'],['APU MASTER','Power the APU control circuit.'],['APU START','Request an APU start.'],['APU AVAILABLE','Training simulation confirms APU availability.'],['APU BLEED','Enable simulated pneumatic supply.'],['FUEL PUMPS','Enable engine fuel pump controls.'],['IGNITION','Enable simulated start ignition.'],['ENGINE 1 / 2','Use the engine controls to complete the demo.']];
function renderSteps(){const el=document.querySelector('#steps');if(!el)return;el.innerHTML='';steps.forEach((s,i)=>{const d=document.createElement('div');d.className='step';d.innerHTML='<span class="dot '+(i<stepIndex?'done':'')+'"></span><span><b>'+s[0]+'</b><br><span class="tiny">'+s[1]+'</span></span>';el.appendChild(d)})}
function nextStep(){const actions=[()=>{state.bat1=state.bat2=true},()=>state.apuMaster=true,()=>{state.apuStart=true;state.apuAvail=true},()=>state.apuAvail=true,()=>state.apuBleed=true,()=>{state.fuel1=state.fuel2=true},()=>state.ign=true,()=>{state.eng1=state.eng2=true}];if(stepIndex<actions.length){actions[stepIndex]();stepIndex++;refresh();renderSteps();showToast('Training step '+stepIndex+' of '+steps.length)}else showToast('Training flow complete')}
